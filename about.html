<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://s1.ticketm.net https://maps.googleapis.com https://maps.gstatic.com https://*.ggpht.com https://*.googleusercontent.com; connect-src 'self' https://concertfyi2000.onrender.com https://maps.googleapis.com https://api.spotify.com https://formspree.io https://photon.komoot.io https://nominatim.openstreetmap.org; frame-src https://open.spotify.com https://www.youtube.com; worker-src 'self' blob:; base-uri 'self'; form-action 'self'; object-src 'none'" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#dc2626" />
    <!--
      These are the site-wide defaults, and the only metadata a crawler that
      does not run JS ever sees. data-rh lets react-helmet-async replace them
      per page instead of appending a second, conflicting copy.
    -->
    <meta
      data-rh="true"
      name="description"
      content="Discover live music, concerts, and setlists. Track your favorite artists and never miss a concert again with concertfyi."
    />

    <!-- Open Graph / Facebook -->
    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:url" content="https://concertfyi.com/" />
    <meta
      data-rh="true"
      property="og:title"
      content="concertfyi - Discover Live Music & Concerts"
    />
    <meta
      data-rh="true"
      property="og:description"
      content="Track your favorite artists, explore past performances, and never miss a concert again."
    />
    <meta data-rh="true" property="og:image" content="https://concertfyi.com/og-image.png" />

    <!-- Twitter reads name=, not property= -->
    <meta data-rh="true" name="twitter:card" content="summary_large_image" />
    <meta
      data-rh="true"
      name="twitter:title"
      content="concertfyi - Discover Live Music & Concerts"
    />
    <meta
      data-rh="true"
      name="twitter:description"
      content="Track your favorite artists, explore past performances, and never miss a concert again."
    />
    <meta data-rh="true" name="twitter:image" content="https://concertfyi.com/og-image.png" />

    <!--
      A fonte morava num @import no topo do index.css, o que punha três idas em fila
      antes da primeira pintura: baixar o CSS do app, só então descobrir a folha do
      Google, só então o .woff2. Daqui a folha sai junto com o CSS do app, e o
      preconnect abre as duas conexões antes de qualquer uma delas ser pedida.
    -->
    <!--
      O proxy no Render é o primeiro terceiro que o app procura, e hoje a conexão com
      ele só começa quando o JS dispara a primeira chamada — depois de baixar, parsear
      e executar o bundle. Medido com `curl -w` na primeira conexão (DNS frio, sem
      sessão TLS): 37 ms de DNS + 6 ms de TCP + 190 ms de TLS = 233 ms em série antes
      de a requisição sair. Daqui isso corre em paralelo com o download do bundle.
      Em desenvolvimento o app fala com o proxy do Vite, então esta linha não é usada.
    -->
    <link rel="preconnect" href="https://concertfyi2000.onrender.com" crossorigin />

    <!--
      A DM Sans é servida daqui, não pelo fonts.gstatic.com: tira dois handshakes de
      DNS+TLS do caminho da primeira pintura e o IP de quem visita deixa de ir para o
      Google por causa da fonte. O @font-face está no index.css; este preload existe
      para o download começar antes de o CSS ser parseado. Só o arquivo latino — o
      latin-ext só é usado quando aparece um nome acentuado.
    -->
    <link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link data-rh="true" rel="canonical" href="https://concertfyi.com/" />

    <!-- Vivid Seats -->
    <meta name="impact-site-verification" value="e467572e-7024-4b72-b1dc-72dbcccf693b" />

    <title>concertfyi - Discover Live Music & Concerts</title>
    <script type="module" crossorigin src="/assets/index-BAI8eCg6.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-COmsiuKZ.css">
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
