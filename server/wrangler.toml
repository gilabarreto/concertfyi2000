# Deploy: Workers Builds do Cloudflare, a cada push em main, com Root directory
# `server`. Sem isso o wrangler roda na raiz, não acha este arquivo e publica um
# Worker vazio que responde 404 em tudo (aconteceu em 2026-11-10).
# Secrets ficam no Worker, não na versão: um deploy pelo Builds herda os que existem.
name = "concertfyi-api"
main = "worker.mjs"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# O Cloudflare cria o registro DNS e o certificado sozinho no deploy.
routes = [{ pattern = "api.concertfyi.com", custom_domain = true }]

# Logs no painel (substitui o stdout do Render que o requestLog usa).
[observability]
enabled = true

[vars]
CLIENT_IP_HEADER = "cf-connecting-ip"

# Chaves de API: secrets, nunca aqui. `npx wrangler secret put NOME` para cada uma
# (lista no CLAUDE.md). Localmente o `wrangler dev` lê do server/.dev.vars.

# Cache dos ids de vídeo do YouTube (routes/youtube.js). Plano grátis: 100 mil
# leituras e 1.000 escritas por dia.
[[kv_namespaces]]
binding = "SONG_CACHE"
id = "1354ac50effc458a9be62ceaf5ec7227"

# Venues guardadas (server/store.js, SPEC-venues.md). Tabela em schema.sql:
# `npx wrangler d1 execute concertfyi --remote --command "$(cat schema.sql)"`. Grátis: 5 mi
# leituras e 100 mil escritas por dia; passou disso, erro (o store cai para a fonte).
[[d1_databases]]
binding = "DB"
database_name = "concertfyi"
database_id = "16e19df4-9e51-43b5-9ce0-ce64627cec87"
