name: Checks

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # O `npm run check` local varre o que está staged; aqui a varredura é na árvore
      # inteira que vai ao ar, antes de existir build para confundir o resultado.
      # Versão fixa: gate que se atualiza sozinho muda de opinião sem ninguém pedir.
      - name: Secret scan
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks dir . --redact --no-banner
          rm gitleaks

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # `npm ci` instala o que está no lockfile e falha se ele divergir do
      # package.json — o que vai ao ar é o que foi resolvido aqui, não o que a
      # data do build resolveria.
      - name: Install client dependencies
        run: npm ci
        working-directory: ./client

      # O `node --test` roda da raiz e acha os testes do servidor junto. Sem as
      # dependências dele, o `require` de qualquer rota derruba o passo inteiro.
      - name: Install server dependencies
        run: npm ci
        working-directory: ./server

      # O portão do CONSTRAINTS.md. O site e a API são publicados pelo Workers Builds da
      # Cloudflare, que não espera este workflow: o que barra antes é o hook de pre-push.
      - name: Format
        run: npm run format:check
        working-directory: ./client

      - name: Lint
        run: npm run lint
        working-directory: ./client

      - name: Format (server)
        run: npm run format:check
        working-directory: ./server

      - name: Lint (server)
        run: npm run lint
        working-directory: ./server

      - name: Test
        run: node --test

      # Só confere que compila; o build publicado é o do Workers Builds, com as VITE_* de lá.
      - name: Build client
        run: npm run build
        working-directory: ./client
