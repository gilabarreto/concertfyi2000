name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

# Dois pushes seguidos publicavam a `gh-pages` ao mesmo tempo e quem terminasse por
# último ganhava — podia ser o commit mais antigo. Enfileira em vez de cancelar: um
# deploy interrompido no meio da publicação deixa a branch pela metade.
concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # O `npm run check` local varre o que está staged; aqui a varredura é na árvore
      # inteira que vai ao ar, antes de existir build para confundir o resultado.
      # Versão fixa: gate que se atualiza sozinho muda de opinião sem ninguém pedir.
      - name: Secret scan
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks dir . --redact --no-banner
          rm gitleaks

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # `npm ci` instala o que está no lockfile e falha se ele divergir do
      # package.json — o que vai ao ar é o que foi resolvido aqui, não o que a
      # data do build resolveria.
      - name: Install client dependencies
        run: npm ci
        working-directory: ./client

      # O `node --test` roda da raiz e acha os testes do servidor junto. Sem as
      # dependências dele, o `require` de qualquer rota derruba o passo inteiro.
      - name: Install server dependencies
        run: npm ci
        working-directory: ./server

      # O portão do CONSTRAINTS.md. Falhou aqui, o Deploy lá embaixo nem roda.
      - name: Format
        run: npm run format:check
        working-directory: ./client

      - name: Lint
        run: npm run lint
        working-directory: ./client

      - name: Test
        run: node --test

      - name: Build client
        run: npm run build 2>&1
        working-directory: ./client
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
          VITE_GOOGLE_MAPS_KEY: ${{ secrets.VITE_GOOGLE_MAPS_KEY }}
          VITE_FORMSPREE_ID: ${{ secrets.VITE_FORMSPREE_ID }}
          VITE_SPOTIFY_CLIENT_ID: ${{ secrets.VITE_SPOTIFY_CLIENT_ID }}

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./client/dist
          cname: concertfyi.com
          publish_branch: gh-pages