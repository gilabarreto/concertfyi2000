# The site as Cloudflare Workers static assets (concertfyi.com since 2026-11-18). Workers Builds
# deploys it on every push to main: Root directory `client`, build command `npm run build`, and
# the VITE_* variables under Settings → Build (the build reads them, not the Worker).
name = "concertfyi-web"
compatibility_date = "2026-11-01"

routes = [
  { pattern = "concertfyi.com", custom_domain = true },
  { pattern = "www.concertfyi.com", custom_domain = true },
]

[assets]
directory = "./dist"
# Every app route (/artists/..., /venues/...) gets index.html with a 200. Headers, CSP included,
# come from dist/_headers (vite.config.js).
not_found_handling = "single-page-application"
